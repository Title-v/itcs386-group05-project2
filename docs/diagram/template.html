<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive HTML Diagram</title>
  <style>
    :root {
      --stage-width: 1600px;
      --stage-height: 900px;
      --paper: #f5f1e8;
      --surface: #fbf7ef;
      --ink: #2a2823;
      --muted: #6b655a;
      --accent: #25443b;
      --accent-soft: #e3ede5;
      --divider-width: 4px;
      --divider-color: var(--accent);
      --shadow: 0 14px 36px rgba(42, 40, 35, 0.14);
      --font: Inter, "IBM Plex Sans Thai", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }

    body {
      overflow: hidden;
      color: var(--ink);
      background: #ddd8ce;
      font-family: var(--font);
    }

    button { font: inherit; }

    .diagram-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .diagram-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--stage-width);
      height: var(--stage-height);
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      cursor: auto;
      transform-origin: top left;
      will-change: transform;
      touch-action: none;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body.is-panning,
    body.is-panning * { user-select: none; }

    .diagram-stage.is-panning { cursor: grabbing; }

    .diagram-content {
      width: 100%;
      height: 100%;
      padding: 64px;
    }

    .diagram-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 44px;
    }

    h1 { margin: 0; color: var(--accent); font-size: 44px; line-height: 1; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 18px; }
    .brand { color: var(--accent); font-size: 24px; font-weight: 800; }

    .sample-flow {
      display: grid;
      grid-template-columns: 1fr 90px 1fr 90px 1fr;
      align-items: center;
      min-height: 620px;
      padding: 54px;
      border: var(--divider-width) solid var(--divider-color);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .node {
      min-height: 210px;
      display: grid;
      place-items: center;
      padding: 30px;
      border: var(--divider-width) solid var(--divider-color);
      border-radius: 20px;
      text-align: center;
      background: var(--accent-soft);
    }

    .node strong { display: block; color: var(--accent); font-size: 25px; }
    .node span { display: block; margin-top: 10px; color: var(--muted); font-size: 17px; }
    .arrow { color: var(--accent); text-align: center; font-size: 52px; font-weight: 800; }

    .diagram-toolbar {
      position: fixed;
      z-index: 100;
      top: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px;
      border: 1px solid rgba(37, 68, 59, 0.24);
      border-radius: 14px;
      background: rgba(251, 247, 239, 0.96);
      box-shadow: 0 8px 24px rgba(42, 40, 35, 0.14);
      backdrop-filter: blur(10px);
    }

    .diagram-toolbar button,
    .zoom-value {
      min-width: 38px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0 11px;
      border: 0;
      border-radius: 9px;
      color: var(--accent);
      background: transparent;
      font-size: 13px;
      font-weight: 750;
    }

    .diagram-toolbar button { cursor: pointer; }
    .diagram-toolbar button:hover { background: var(--accent-soft); }
    .diagram-toolbar button:focus-visible { outline: 3px solid #7ba88f; outline-offset: 2px; }
    .zoom-value { min-width: 58px; color: var(--muted); }

    .diagram-toolbar .export-button {
      color: #fff;
      background: var(--accent);
    }

    .diagram-toolbar .export-button:hover { background: #193a30; }

    @page { size: 1600px 900px; margin: 0; }

    @media print {
      html, body {
        width: 1600px;
        height: 900px;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--paper);
      }

      .diagram-toolbar { display: none !important; }

      .diagram-viewport {
        position: static;
        width: 1600px;
        height: 900px;
        overflow: hidden;
      }

      .diagram-stage {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="diagram-viewport" class="diagram-viewport">
    <main id="diagram-stage" class="diagram-stage" aria-label="Interactive diagram">
      <section class="diagram-content">
        <header class="diagram-header">
          <div>
            <h1>Interactive HTML Diagram</h1>
            <p class="subtitle">Replace this sample flow with the requested diagram.</p>
          </div>
          <div class="brand">HTML Diagram</div>
        </header>

        <section class="sample-flow" aria-label="Example three-step flow">
          <article class="node"><div><strong>Input</strong><span>Source or starting state</span></div></article>
          <div class="arrow" aria-hidden="true">→</div>
          <article class="node"><div><strong>Process</strong><span>Transformation or decision</span></div></article>
          <div class="arrow" aria-hidden="true">→</div>
          <article class="node"><div><strong>Output</strong><span>Result or destination</span></div></article>
        </section>
      </section>
    </main>
  </div>

  <nav class="diagram-toolbar" aria-label="Diagram view controls" data-no-pan>
    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    <output id="zoom-value" class="zoom-value" aria-live="polite">100%</output>
    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" id="fit-view">Fit</button>
    <button type="button" id="reset-view">Reset</button>
    <button type="button" id="export-pdf" class="export-button">Export PDF</button>
  </nav>

  <script>
    (() => {
      const viewport = document.getElementById("diagram-viewport");
      const stage = document.getElementById("diagram-stage");
      const zoomValue = document.getElementById("zoom-value");
      const zoomOutButton = document.getElementById("zoom-out");
      const zoomInButton = document.getElementById("zoom-in");
      const fitButton = document.getElementById("fit-view");
      const resetButton = document.getElementById("reset-view");
      const exportButton = document.getElementById("export-pdf");

      const stageWidth = 1600;
      const stageHeight = 900;
      const minimumZoom = 0.50;
      const maximumZoom = 2;
      const minimumFitZoom = 0.20;
      const zoomStep = 0.10;
      const wheelGestureIdleMs = 160;
      const panOverflow = 140;
      const noPanSelector = "button, a, input, textarea, select, [contenteditable=\"true\"], [data-no-pan]";

      let zoom = 1;
      let pan = { x: 0, y: 0 };
      let viewMode = "manual";
      let viewportSize = { width: viewport.clientWidth, height: viewport.clientHeight };
      let activePointerId = null;
      let lastPointer = null;
      let activePanButton = null;
      let didPanMove = false;
      let suppressNextContextMenu = false;
      let lastWheelTime = -Infinity;
      let lastWheelDirection = 0;

      const resetWheelGesture = () => {
        lastWheelTime = -Infinity;
        lastWheelDirection = 0;
      };

      const nextWheelDirection = (deltaY, now) => {
        const direction = deltaY < 0 ? 1 : -1;
        // A smooth wheel can emit many events for one gesture, including inertia.
        // Apply its leading edge once; do not queue a delayed/trailing zoom.
        const startsGesture = direction !== lastWheelDirection || now - lastWheelTime >= wheelGestureIdleMs;
        lastWheelTime = now;
        lastWheelDirection = direction;
        return startsGesture ? direction : 0;
      };

      const constrainPan = () => {
        const spareX = viewport.clientWidth - stageWidth * zoom;
        const spareY = viewport.clientHeight - stageHeight * zoom;
        const minimumX = Math.min(0, spareX) - panOverflow;
        const minimumY = Math.min(0, spareY) - panOverflow;
        pan.x = Math.min(Math.max(0, spareX) + panOverflow, Math.max(minimumX, pan.x));
        pan.y = Math.min(Math.max(0, spareY) + panOverflow, Math.max(minimumY, pan.y));
      };

      const applyView = () => {
        constrainPan();
        stage.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
        stage.dataset.viewMode = viewMode;
        zoomValue.textContent = `${Math.round(zoom * 100)}%`;
      };

      const setZoomAt = (nextZoom, focalX, focalY) => {
        viewMode = "manual";
        const clampedZoom = Math.min(maximumZoom, Math.max(minimumZoom, nextZoom));
        if (clampedZoom === zoom) return;

        const diagramPoint = {
          x: (focalX - pan.x) / zoom,
          y: (focalY - pan.y) / zoom
        };
        zoom = clampedZoom;
        pan = {
          x: focalX - diagramPoint.x * zoom,
          y: focalY - diagramPoint.y * zoom
        };
        applyView();
      };

      const zoomAtViewportCenter = (delta) => {
        resetWheelGesture();
        setZoomAt(
          Number((zoom + delta).toFixed(2)),
          viewport.clientWidth / 2,
          viewport.clientHeight / 2
        );
      };

      const fitView = () => {
        resetWheelGesture();
        viewMode = "fit";
        viewportSize = { width: viewport.clientWidth, height: viewport.clientHeight };
        const margin = 28;
        zoom = Math.min(
          maximumZoom,
          Math.max(
            minimumFitZoom,
            Math.min(
              (viewport.clientWidth - margin * 2) / stageWidth,
              (viewport.clientHeight - margin * 2) / stageHeight
            )
          )
        );
        pan = {
          x: (viewport.clientWidth - stageWidth * zoom) / 2,
          y: (viewport.clientHeight - stageHeight * zoom) / 2
        };
        applyView();
      };

      const resetView = () => {
        resetWheelGesture();
        viewMode = "manual";
        viewportSize = { width: viewport.clientWidth, height: viewport.clientHeight };
        zoom = 1;
        pan = { x: 0, y: 0 };
        applyView();
      };

      const handleResize = () => {
        const nextSize = { width: viewport.clientWidth, height: viewport.clientHeight };
        if (nextSize.width === viewportSize.width && nextSize.height === viewportSize.height) return;
        if (viewMode === "fit") { fitView(); return; }
        // Keep the same diagram point at the center during manual navigation.
        pan.x += (nextSize.width - viewportSize.width) / 2;
        pan.y += (nextSize.height - viewportSize.height) / 2;
        viewportSize = nextSize;
        applyView();
      };

      const finishPan = (event) => {
        if (event.pointerId !== activePointerId) return;
        if (activePanButton === 2 && didPanMove) suppressNextContextMenu = true;
        if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        activePointerId = null;
        lastPointer = null;
        activePanButton = null;
        didPanMove = false;
        stage.classList.remove("is-panning");
        viewport.classList.remove("is-panning");
        document.body.classList.remove("is-panning");
      };

      viewport.addEventListener("pointerdown", (event) => {
        if (activePointerId !== null) return;
        const isSecondaryPan = event.button === 2;
        const isCommandPrimaryPan = event.button === 0 && event.metaKey && !event.ctrlKey;
        if ((!isSecondaryPan && !isCommandPrimaryPan) || event.target.closest(noPanSelector)) return;
        activePointerId = event.pointerId;
        lastPointer = { x: event.clientX, y: event.clientY };
        activePanButton = event.button;
        didPanMove = false;
        viewport.setPointerCapture(activePointerId);
        stage.classList.add("is-panning");
        viewport.classList.add("is-panning");
        document.body.classList.add("is-panning");
        event.preventDefault();
      });

      viewport.addEventListener("pointermove", (event) => {
        if (event.pointerId !== activePointerId || lastPointer === null) return;
        const deltaX = event.clientX - lastPointer.x;
        const deltaY = event.clientY - lastPointer.y;
        if (deltaX !== 0 || deltaY !== 0) { didPanMove = true; viewMode = "manual"; }
        pan.x += deltaX;
        pan.y += deltaY;
        lastPointer = { x: event.clientX, y: event.clientY };
        applyView();
        event.preventDefault();
      });

      viewport.addEventListener("pointerup", finishPan);
      viewport.addEventListener("pointercancel", finishPan);
      viewport.addEventListener("lostpointercapture", finishPan);

      viewport.addEventListener("contextmenu", (event) => {
        if (event.target.closest(noPanSelector)) return;
        const isActiveSecondaryDrag = activePanButton === 2 && didPanMove;
        if (!suppressNextContextMenu && !isActiveSecondaryDrag) return;
        event.preventDefault();
        suppressNextContextMenu = false;
      });

      document.addEventListener("wheel", (event) => {
        if (document.querySelector('#case-code-dialog[open]')) { resetWheelGesture(); return; }
        if (!event.ctrlKey && !event.metaKey) { resetWheelGesture(); return; }
        if (!Number.isFinite(event.deltaY) || event.deltaY === 0) return;
        if (!event.cancelable) return;
        // Consume every modified vertical event, including suppressed inertia,
        // across the diagram and toolbar so native/bubbling zoom cannot stack.
        event.preventDefault();
        event.stopPropagation();
        const direction = nextWheelDirection(event.deltaY, performance.now());
        if (!direction) return;
        const nextZoom = Number((zoom + direction * zoomStep).toFixed(2));
        const rect = viewport.getBoundingClientRect();
        setZoomAt(nextZoom, event.clientX - rect.left, event.clientY - rect.top);
      }, { passive: false, capture: true });

      document.addEventListener("keyup", (event) => {
        if (event.key === "Control" || event.key === "Meta") resetWheelGesture();
      });
      window.addEventListener("blur", resetWheelGesture);

      zoomOutButton.addEventListener("click", () => zoomAtViewportCenter(-zoomStep));
      zoomInButton.addEventListener("click", () => zoomAtViewportCenter(zoomStep));
      fitButton.addEventListener("click", fitView);
      resetButton.addEventListener("click", resetView);
      exportButton.addEventListener("click", async () => {
        if (document.fonts?.ready) await document.fonts.ready;
        window.print();
      });

      window.addEventListener("keydown", (event) => {
        if (document.querySelector('#case-code-dialog[open]')) return;
        if ((event.ctrlKey || event.metaKey) && event.key === "0") {
          event.preventDefault();
          resetView();
        }
      });

      window.addEventListener("resize", handleResize);
      if (typeof ResizeObserver !== "undefined") new ResizeObserver(handleResize).observe(viewport);
      applyView();
    })();
  </script>
</body>
</html>
